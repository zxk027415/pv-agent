[project]
name = "pvdiag"
version = "0.1.0"
description = "LangGraph + MCP agent for PV plant time-series fault diagnosis, evaluated on public PVDAQ data with injected faults."
readme = "docs/DESIGN.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=17",
    "httpx[socks]>=0.27",
    "fastmcp==4.1.3",
    "pvlib==0.16.1",
    "pydantic>=2.11,<3",
    "langgraph==1.2.17",
    "langchain>=1,<2",
    "langchain-openai>=1,<2",
    "python-dotenv>=1,<2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pvdiag"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
